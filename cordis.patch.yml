- insert:
    - id: dsh-openfilm
      name: 'dsh-openfilm'
    # OpenFilm's editing session: a whitelist, not a denylist. Only the plugins below are mounted, so
    # only their tools exist for the agent — anything else (codegraph, subagents, goals, Office, image
    # generation) is absent by construction. Third-party tools are deliberately not mentioned here at
    # all: someone else installing a plugin must never collide with this preset.
    #
    # Reading is the point (read/read_image/glob/grep), editing goes through edit/write or the
    # openfilm_* tools, and running is pwsh/bash for the bundled OpenFilm CLI (plus openfilm_cli for
    # doctor/look/render without a shell). web_search/web_fetch stay: references are part of the work.
    - id: preset-openfilm-video-editing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: openfilm-video-editing
        name: OpenFilm Video Editing
        description: Edit OpenFilm projects with scoped video-editing guidance.
        plugins:
          - id: openfilm-video-prompt
            name: 'dsh-openfilm/openfilm-prompt'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # Skills are wanted — a design style is one dropped folder — but only the ones reachable from
          # the roots below. `dsh-openfilm/skills` is mirrored into <dshHome>/skills by
          # `node scripts/install-skills.mjs`; a person can add their own beside it and the catalog
          # refreshes without a restart (the provider watches its roots).
          #
          # The skill *registry* (`@deepseek-ai/dsh-skill`) is mounted by the host itself; mounting it
          # again here made the whole preset fail to load, which showed up as
          # `PROJECT_CONVERSATION_CREATE` on every prompt and a missing 权限 row. Only the file
          # provider belongs in this list, with its defaults (project + user roots, watched) — the
          # defaults are exactly what we want, and spelling them out was a second way to break the
          # preset if a field name ever drifted.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            # Required by 0.2.2; omitting it breaks the whole preset.
            config:
              sampleOverCapGlobResults: false
