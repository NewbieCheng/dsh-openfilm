<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>17 · 交接结果</title>
  <link rel="stylesheet" href="../assets/scene.css">

</head>
<body>
<main id="stage" class="ice">
  <div class="content" id="content"></div>
</main>
<script src="../assets/scene.js"></script>
<script>
  // 本镜头的可替换内容。配色在上方 stage 类名和本页 CSS 中修改。
  const COPY = {
    "chapter": "交接结果",
    "note": "",
    "presenter": {
      "shape": "circle",
      "image": "../assets/presenter.svg",
      "label": "人物位",
      "video": "",
      "in": 0
    },
    "title": "让内容接力",
    "tags": [
      "文稿",
      "素材",
      "准备就绪"
    ],
    "receivers": [
      "画面",
      "声音",
      "字幕"
    ],
    "stamp": "交接完成",
    "cues": {
      "title": 0.02,
      "first": 1.7,
      "second": 1.9,
      "giver": 2.37,
      "object": 3.07,
      "transfer": 4.24,
      "receivers": 4.37,
      "arrival": 5.07,
      "confirmation": 6.38
    }
  };
  const DURATION = 8.567;
  const START = 100.033;
  const { $, $$, range, ease, wave, pose, enter, escape, mount } = Scene;

  $('#content').innerHTML = `
<div class="at hero" id="title" style="top:362px"><h2 class="sticker">${escape(COPY.title)}</h2>
      <div class="chip-row" style="margin-top:66px">${COPY.tags.map((tag,i) => `<span class="pill preparation ${i===2?'dark-pill':''}">• ${escape(tag)}</span>`).join('')}</div>
    </div>
    <svg class="at" style="left:289px;top:784px;width:498px;height:385px;overflow:visible" viewBox="0 0 498 385">
      <path id="route" d="M0 99C190-22 353 0 498 285" pathLength="1" stroke="#7d97a5" stroke-width="4" stroke-dasharray="1" fill="none"/>
    </svg>
    <img class="at scene-icon" id="giver" src="../assets/robot.svg" alt="" style="left:132px;top:710px;width:303px">
    <div class="at" id="receiver" style="left:666px;top:1008px;width:233px;height:315px">
      <img class="scene-icon" src="../assets/robot.svg" alt="" style="width:226px">
      <div style="position:absolute;left:14px;right:14px;top:189px;background:#ac7f4c;border-radius:26px 26px 10px 10px;height:32px;box-shadow:0 12px 0 #645044"></div>
    </div>
    <img class="at scene-icon handoff-book" id="book" src="../assets/book.svg" alt="" style="left:327px;top:748px">
    <div class="at chip-row" style="left:435px;top:1347px">${COPY.receivers.map((label) => `<span class="pill receiver-label">• ${escape(label)}</span>`).join('')}</div>
    <span class="at sticker" id="stamp" style="left:498px;top:1184px;color:#fff;background:#f0462d;font-size:30px">${escape(COPY.stamp)}</span>
  `;

  // t 是镜头内的秒数，任意顺序调用都会重建同一画面。
  function draw(t) {
    const cue = COPY.cues;
    enter('#title', t, cue.title);
    $$('.preparation').forEach((node,i) => enter(node, t, [cue.first, cue.second, cue.giver][i], { spring: true }));
    enter('#giver', t, cue.giver, { x: -80, rotate: -13, spring: true });
    enter('#receiver', t, cue.receivers, { x: 120, rotate: 12, spring: true });
    const transfer = ease(range(t, cue.transfer, cue.arrival - cue.transfer));
    const open = range(t, cue.object, .4);
    pose('#book', { x: 426 * transfer, y: 405 * transfer - 172 * wave(transfer), scale: .7 + .3 * open - .22 * transfer, opacity: open, rotate: -17 + 32 * transfer });
    $('#route').style.strokeDashoffset = 1 - transfer;
    $('#route').style.opacity = .57 - .34 * range(t, cue.arrival + .25, .6);
    $$('.receiver-label').forEach((node,i) => enter(node, t, cue.receivers + i * .19, { spring: true, y: 14 }));
    enter('#stamp', t, cue.confirmation, { scale: 1.72, y: -36, rotate: -13, spring: true, duration: .36 });
  }
  mount(COPY, DURATION, START, draw);
</script>
</body>
</html>
