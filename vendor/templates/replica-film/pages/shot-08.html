<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>08 · 代码变焦</title>
  <link rel="stylesheet" href="../assets/scene.css">

</head>
<body>
<main id="stage" class="dark">
  <div class="content" id="content"></div>
</main>
<script src="../assets/scene.js"></script>
<script>
  // 本镜头的可替换内容。配色在上方 stage 类名和本页 CSS 中修改。
  const COPY = {
    "chapter": "代码变焦",
    "note": "让计数与变化一起发生",
    "presenter": {
      "shape": "circle",
      "image": "../assets/presenter.svg",
      "label": "人物位",
      "video": "",
      "in": 0
    },
    "title": "一段简报",
    "snippet": [
      "# 动画计划",
      "风格：清晰、有节奏",
      "输入：文稿与录屏",
      "输出：可编辑镜头"
    ],
    "from": 20,
    "to": 10000,
    "unit": "行 · 演示数值"
  };
  const DURATION = 7.233;
  const START = 46.7;
  const { $, $$, range, ease, lerp, pose, enter, text, escape, mount } = Scene;

  $('#content').innerHTML = `
<article class="at card mono" id="code" style="left:183px;top:479px;width:527px;transform-origin:left top">
      <small style="color:#888">编辑器　●　○　○</small>
      ${COPY.snippet.map((line) => `<p class="code-line" style="margin-top:12px;font-size:24px">${escape(line)}</p>`).join('')}
    </article>
    <h1 class="at" id="title" style="left:183px;top:920px;width:690px;text-align:center;font-size:70px">${escape(COPY.title)}</h1>
    <div class="at" id="metric" style="left:178px;top:1137px"><b class="number gold" id="counter"></b><br><span>${escape(COPY.unit)}</span></div>
    <img class="at scene-icon" id="wrench" src="../assets/wrench.svg" alt="" style="left:814px;top:1120px;width:102px">
  `;

  // t 是镜头内的秒数，任意顺序调用都会重建同一画面。
  function draw(t) {
    const inView = ease(range(t, .24, .65));
    const zoom = ease(range(t, 3.25, 1.25));
    pose('#code', { y: 72 * (1 - inView) - 70 * zoom, x: -62 * zoom, scale: .82 + .18 * inView + .36 * zoom, opacity: inView });
    $$('.code-line').forEach((node,i) => enter(node, t, .5 + i * .18, { y: 9 }));
    enter('#title', t, .95);
    enter('#metric', t, 3.85);
    const n = Math.round(lerp(COPY.from, COPY.to, ease(range(t, 4.0, 1.9))));
    text('#counter', n.toLocaleString('en-US'));
    enter('#wrench', t, 4.25, { rotate: 36, spring: true });
  }
  mount(COPY, DURATION, START, draw);
</script>
</body>
</html>
