<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10 · 用量仪表</title>
  <link rel="stylesheet" href="../assets/scene.css">
</head>
<body>
<main id="stage" class="blue">
  <div class="content" id="content">
<h2 class="at hero" id="title">让数值变化有过程</h2>
    <div class="at" id="meter" style="left:76px;top:815px;width:928px">
      <div class="mono" style="font-size:23px;display:flex;justify-content:space-between"><span>示例用量</span><span id="meter-text"></span></div>
      <div class="counter-progress"><i></i></div>
    </div>
    <img class="at scene-icon token" src="../assets/coin.svg" alt="" style="left:98px;top:1030px;width:58px"><img class="at scene-icon token" src="../assets/coin.svg" alt="" style="left:190px;top:1030px;width:58px"><img class="at scene-icon token" src="../assets/coin.svg" alt="" style="left:282px;top:1030px;width:58px"><img class="at scene-icon token" src="../assets/coin.svg" alt="" style="left:374px;top:1030px;width:58px"><img class="at scene-icon token" src="../assets/coin.svg" alt="" style="left:466px;top:1030px;width:58px"><img class="at scene-icon token" src="../assets/coin.svg" alt="" style="left:558px;top:1030px;width:58px"><img class="at scene-icon token" src="../assets/coin.svg" alt="" style="left:650px;top:1030px;width:58px"><img class="at scene-icon token" src="../assets/coin.svg" alt="" style="left:742px;top:1030px;width:58px"><img class="at scene-icon token" src="../assets/coin.svg" alt="" style="left:834px;top:1030px;width:58px">
  </div>
</main>
<script src="../assets/motion.js"></script>
<script src="../assets/scene.js"></script>
<script>
  // 本镜头的可替换内容。配色在上方 stage 类名和本页 CSS 中修改。
  const COPY = {
    "chapter": "用量仪表",
    "note": "用动画解释变化",
    "presenter": {
      "shape": "circle",
      "image": "../assets/presenter.svg",
      "label": "人物位",
      "video": "",
      "in": 0
    },
    "title": "让数值变化有过程",
    "maximum": 100,
    "label": "示例用量"
  };
  const DURATION = 4.233;
  const START = 59.267;
  const { $, $$, range, ease, wave, pose, enter, text, escape, mount } = Scene;

  // t 是镜头内的秒数，任意顺序调用都会重建同一画面。
  function draw(t) {
      enter('#title', t, .10);
      enter('#meter', t, .62);
      const p = ease(range(t, .8, 2.5));
      text('#meter-text', Math.round(p * COPY.maximum) + ' / ' + COPY.maximum);
      $('.counter-progress i').style.transform = `scaleX(${p})`;
      $$('.token').forEach((node,i) => {
        const arc = range(t, 1.05 + i * .12, 1.0);
        pose(node, { opacity: Math.min(1, arc * 4) * (1 - range(t, 3.48, .36)), y: 55 - 157 * wave(arc) - i * 11, x: 37 * arc, scale: .62 + .38 * arc, rotate: i * 37 + arc * 168 });
      });
  }
  mount(COPY, DURATION, START, draw);
</script>
</body>
</html>
