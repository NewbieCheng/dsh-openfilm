<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11 · 按钮响应</title>
  <link rel="stylesheet" href="../assets/scene.css">
  <style>#stage.orange.radial { --theme: linear-gradient(128deg,#ec321b,#ff9e24); }</style>
</head>
<body>
<main id="stage" class="orange radial">
  <div class="content" id="content">
<div class="at" style="left:84px;top:658px">
      <div id="result"><h1 class="gold" style="font-size:125px;text-shadow:0 4px 24px #701a17ad">有反馈</h1><p style="font-size:34px;margin-top:21px">互动需要被看见</p></div>
      <div class="chip-row" style="margin-top:121px;gap:25px">
      <span class="pill button"><i class="dot green"></i>已开始</span><span class="pill button"><i class="dot red"></i>确认方案</span><span class="pill button"><i class="dot green"></i>留下反馈</span>
      </div>
    </div>
    <img class="at scene-icon" id="heart" src="../assets/heart.svg" alt="" style="left:537px;top:631px;width:136px">
    <svg class="at" id="spark" style="left:364px;top:558px;width:375px;height:351px;overflow:visible" viewBox="0 0 375 351">
      <circle cx="334" cy="175" r="2" fill="#ffde85"/><circle cx="319.14533018536287" cy="230.10323486792987" r="3" fill="#ffde85"/><circle cx="277.52347027881" cy="274.2925982734398" r="4" fill="#ffde85"/><circle cx="217.37814009344717" cy="298.8158448470916" r="2" fill="#ffde85"/><circle cx="150.62185990655286" cy="298.8158448470916" r="3" fill="#ffde85"/><circle cx="90.47652972118998" cy="274.2925982734398" r="4" fill="#ffde85"/><circle cx="48.854669814637134" cy="230.1032348679299" r="2" fill="#ffde85"/><circle cx="34" cy="175.00000000000003" r="3" fill="#ffde85"/><circle cx="48.854669814637134" cy="119.89676513207013" r="4" fill="#ffde85"/><circle cx="90.47652972118995" cy="75.70740172656024" r="2" fill="#ffde85"/><circle cx="150.6218599065528" cy="51.1841551529084" r="3" fill="#ffde85"/><circle cx="217.378140093447" cy="51.184155152908374" r="4" fill="#ffde85"/><circle cx="277.52347027881" cy="75.7074017265602" r="2" fill="#ffde85"/><circle cx="319.1453301853629" cy="119.89676513207019" r="3" fill="#ffde85"/>
    </svg>
  </div>
</main>
<script src="../assets/scene.js"></script>
<script>
  // 本镜头的可替换内容。配色在上方 stage 类名和本页 CSS 中修改。
  const COPY = {
    "chapter": "按钮响应",
    "note": "也应该有清楚的回应",
    "presenter": {
      "shape": "portrait",
      "image": "../assets/presenter.svg",
      "label": "人物位",
      "video": "",
      "in": 0
    },
    "title": "有反馈",
    "subtitle": "互动需要被看见",
    "buttons": [
      "已开始",
      "确认方案",
      "留下反馈"
    ]
  };
  const DURATION = 5.633;
  const START = 63.5;
  const { $, $$, range, wave, pose, enter, escape, mount } = Scene;

  // t 是镜头内的秒数，任意顺序调用都会重建同一画面。
  function draw(t) {
      enter('#result', t, .45, { y: 75, scale: .6, spring: true });
      enter('#heart', t, .78, { x: 55, y: -57, rotate: 40, spring: true });
      const spark = range(t, .65, 1.25);
      pose('#spark', { scale: spark * 1.4, opacity: wave(spark), rotate: 41 * spark });
      $$('.button').forEach((node,i) => enter(node, t, 1.21 + i * .46, { spring: true, scale: .62 }));
  }
  mount(COPY, DURATION, START, draw);
</script>
</body>
</html>
