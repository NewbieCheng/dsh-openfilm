<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>14 · 突出重点</title>
  <link rel="stylesheet" href="../assets/scene.css">
</head>
<body>
<main id="stage" class="dark">
  <div class="content" id="content">
<div class="at hero" style="top:438px">
      <h1 id="title" style="font-size:64px">内容接力</h1>
      <div class="gold-rule" id="rule" style="margin-top:74px"></div>
      <p id="body" style="margin-top:36px;font-size:34px;width:870px">让角色和物件解释内容关系</p>
    </div>
    <div class="at page-list">
      
    </div>
    <span class="at sticker" id="stamp" style="left:796px;top:1278px;padding:4px 16px;font-family:monospace;font-size:35px">◎</span>
  </div>
</main>
<script src="../assets/motion.js"></script>
<script src="../assets/scene.js"></script>
<script>
  // 本镜头的可替换内容。配色在上方 stage 类名和本页 CSS 中修改。
  const COPY = {
    "chapter": "突出重点",
    "note": "突出这段话真正想说的重点",
    "presenter": {
      "shape": "circle",
      "image": "../assets/presenter.svg",
      "label": "人物位",
      "video": "",
      "in": 0
    },
    "title": "内容接力",
    "body": "让角色和物件解释内容关系",
    "items": [],
    "colors": [
      "#ffd166",
      "#b6a1e6",
      "#86ddc3",
      "#eea698",
      "#aabdea"
    ],
    "cue": 0.14,
    "mode": "keyword"
  };
  const DURATION = 6;
  const START = 82.033;
  const { $, $$, range, ease, wave, pose, enter, escape, mount } = Scene;

  // t 是镜头内的秒数，任意顺序调用都会重建同一画面。
  function draw(t) {
      const start = COPY.cue;
      enter('#title', t, start, { y: 22, duration: .52 });
      const line = ease(range(t, start + .32, .65));
      pose('#rule', { scale: Math.max(.001, line), opacity: line });
      enter('#body', t, start + .72, { y: 18 });
      $$('.point').forEach((node,i) => enter(node, t, start + .64 + i * .42, { x: -73, y: 0, spring: true }));
      const phase = range(t, start + 1.05, .85);
      const hit = wave(range(t, start + 1.67, .31));
      const show = COPY.mode !== 'points';
      pose('#stamp', { x: 174 * (1 - phase), y: -135 * wave(phase), scale: .62 + .38 * phase + .3 * hit,
        rotate: 45 * (1 - phase) - 9 + 11 * hit, opacity: show ? phase : 0 });
  }
  mount(COPY, DURATION, START, draw);
</script>
</body>
</html>
