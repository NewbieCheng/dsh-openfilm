<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>纸纹讲堂 · 操作步骤</title>
<link rel="stylesheet" href="../assets/kit.css">
<style>
:root {
  --kicker-size: 32px;
  --kicker-tracking: .3em;
  --title-size: 78px;
  --title-gap: 16px;
  --em-pad: 8px;
  --capsule-bottom: 130px;
}
body { background: var(--paper); }
</style>
</head>
<body>
<div class="head">
  <div class="kicker">做 法</div>
  <div class="title">三步做<em>完一页</em></div>
</div>
<div class="steps"><div class="step"><div class="num">1</div><div class="body"><h3>放素材</h3><p>课件截图、板书照片、图表，一张一页，画面居中。</p></div></div><div class="step"><div class="num">2</div><div class="body"><h3>写逐字稿</h3><p>一页一段口播，控制在 15 秒内，句子短、主语明确。</p></div></div><div class="step"><div class="num">3</div><div class="body"><h3>按句换页</h3><p>讲到关键词就硬切换页，留空时回到纸纹底。</p></div></div></div>
<div class="capsule">字幕胶囊：三步的顺序不要打乱，先素材、再稿子、最后切页。</div>
<script>
// A still page has the same DOM picture at every local time.
  window.film = { width: 1080, height: 1920, duration: 7, ready: document.fonts.ready, frame(_t) {} };
</script>
</body>
</html>
