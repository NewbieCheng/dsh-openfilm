<!doctype html>
<html lang="zh-CN">
<head>

<title>纸纹讲堂 · 标题页</title>
<link rel="stylesheet" href="../assets/kit.css">
<style>

<body>

<div class="capsule">字幕胶囊：一句话说清这一页要讲什么。</div>
<script>

  window.film = { width: 1080, height: 1920, duration: 6, ready: document.fonts.ready, frame(_t) {} };

</html>
