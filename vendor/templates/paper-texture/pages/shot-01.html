<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>纸纹讲堂 · 标题页</title>
<style>
  :root { --paper:#e1d5c5; --ink:#214f42; --wheat:#f0df9f; --charcoal:#242820; --white:#faf6ee; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: radial-gradient(120% 80% at 50% 0%, #ece2d3 0%, var(--paper) 55%, #d9cbb8 100%); font-family: "Songti SC", "SimSun", serif; color: var(--ink); position: relative; }
  .grain { position: absolute; inset: 0; opacity: .22; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.35'/></svg>"); }
  .head { position: absolute; top: 96px; left: 88px; right: 88px; }
  .kicker { font-size: 34px; letter-spacing: .32em; color: #6b5c47; }
  .title { margin-top: 20px; font-size: 92px; line-height: 1.12; font-weight: 700; }
  .title em { font-style: normal; background: linear-gradient(transparent 58%, var(--wheat) 58%); padding: 0 6px; }
  .stage { position: absolute; top: 400px; left: 88px; right: 88px; height: 900px; background: var(--white); border: 3px solid #cbbca6; border-radius: 10px; box-shadow: 0 24px 60px rgba(60,48,32,.18); display: flex; align-items: center; justify-content: center; }
  .stage .slide { width: 88%; height: 78%; border: 2px dashed #d8cab6; border-radius: 8px; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; color: #8d7a60; font-size: 30px; }
  .slide b { font-size: 48px; color: var(--ink); }
  .nameplate { position: absolute; left: 88px; bottom: 300px; writing-mode: vertical-rl; background: var(--ink); color: #f7f1e3; padding: 26px 14px; border-radius: 8px; font-size: 34px; letter-spacing: .18em; }
  .presenter { position: absolute; right: 88px; bottom: 260px; width: 300px; height: 380px; border-radius: 24px; background: linear-gradient(160deg, #2f6a58, #183a30); box-shadow: 0 20px 44px rgba(24,58,48,.35); display: flex; align-items: center; justify-content: center; color: #cfe3da; font-size: 26px; }
  .capsule { position: absolute; left: 88px; right: 88px; bottom: 120px; background: rgba(36,40,32,.92); color: #f3efe6; border-radius: 999px; padding: 26px 44px; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 34px; text-align: center; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="head">
    <div class="kicker">纸 纹 讲 堂</div>
    <div class="title">一页纸，讲<em>清一件事</em></div>
  </div>
  <div class="stage"><div class="slide"><b>你的课件标题</b><span>把 PPT / 截图放进这里的通栏区域</span></div></div>
  <div class="nameplate">讲者 · 你的名字</div>
  <div class="presenter">人物窗口</div>
  <div class="capsule">字幕胶囊：一句话说清这一页要讲什么。</div>
</body>
</html>
